<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmptyEpsilon Web</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: rgba(11, 16, 24, 0.88);
      --ink: #d8e1ec;
      --muted: #8ea0b5;
      --accent: #6fd3ff;
      --danger: #ff6f91;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(49, 94, 157, 0.35), transparent 35%),
        linear-gradient(180deg, #08111c 0%, var(--bg) 100%);
      color: var(--ink);
      font: 14px/1.4 "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    #title {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    #hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #hud-actions button {
      padding: 8px 12px;
      border: 1px solid rgba(111, 211, 255, 0.25);
      background: rgba(11, 16, 24, 0.92);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }

    #hud-actions button:hover {
      border-color: rgba(111, 211, 255, 0.55);
      color: var(--accent);
    }

    #hud-actions button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      border-color: rgba(255, 255, 255, 0.14);
      color: var(--muted);
    }

    #hud-actions button.active {
      border-color: rgba(111, 211, 255, 0.75);
      background: rgba(31, 73, 94, 0.92);
      color: var(--accent);
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(11, 16, 24, 0.96);
      color: var(--ink);
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms ease;
      z-index: 20;
      max-width: min(80vw, 520px);
      text-align: center;
    }

    #toast.visible {
      opacity: 1;
    }

    #status {
      flex: 1 1 auto;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #canvas-wrap {
      position: relative;
      min-height: 0;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #000;
    }

    #overlay {
      display: none;
      position: absolute;
      top: 16px;
      right: 16px;
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100% - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 16px;
      background: rgba(11, 16, 24, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      z-index: 15;
      pointer-events: none;
    }

    #overlay strong {
      color: var(--accent);
      pointer-events: auto;
    }

    #controls {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      pointer-events: auto;
    }

    #controls label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    #controls input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(14, 20, 31, 0.96);
      color: var(--ink);
      outline: none;
    }

    #controls select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(14, 20, 31, 0.96);
      color: var(--ink);
      outline: none;
    }

    #controls input:focus,
    #controls select:focus {
      border-color: rgba(111, 211, 255, 0.5);
    }

    /* Session list */
    #session-list {
      display: grid;
      gap: 6px;
    }

    .session-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(14, 20, 31, 0.8);
      cursor: pointer;
      transition: border-color 80ms;
    }

    .session-option:hover {
      border-color: rgba(111, 211, 255, 0.35);
    }

    .session-option.selected {
      border-color: rgba(111, 211, 255, 0.65);
      background: rgba(20, 50, 75, 0.85);
    }

    .session-option input[type="radio"] {
      width: auto;
      margin-top: 3px;
      flex-shrink: 0;
      accent-color: var(--accent);
    }

    .session-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .session-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .session-desc {
      font-size: 11px;
      color: var(--muted);
    }

    .session-count {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--accent);
      padding-top: 3px;
    }

    .session-loading {
      color: var(--muted);
      font-size: 12px;
      padding: 8px 0;
    }

    /* Station grid */
    #station-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .station-btn {
      padding: 8px 6px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(14, 20, 31, 0.8);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      transition: border-color 80ms, color 80ms;
    }

    .station-btn:hover {
      border-color: rgba(111, 211, 255, 0.35);
      color: var(--ink);
    }

    .station-btn.selected {
      border-color: rgba(111, 211, 255, 0.65);
      background: rgba(20, 50, 75, 0.85);
      color: var(--accent);
    }

    #join-btn {
      padding: 12px;
      border: 1px solid rgba(111, 211, 255, 0.5);
      background: rgba(20, 60, 90, 0.9);
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 80ms, border-color 80ms;
    }

    #join-btn:hover:not(:disabled) {
      background: rgba(30, 80, 115, 0.95);
      border-color: rgba(111, 211, 255, 0.8);
    }

    #join-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #advanced-toggle {
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
      background: none;
      border: none;
      padding: 0;
    }

    #advanced-toggle:hover {
      color: var(--ink);
    }

    #advanced-panel {
      display: none;
      gap: 8px;
    }

    #advanced-panel.open {
      display: grid;
    }

    #actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #actions button {
      padding: 10px 12px;
      border: 1px solid rgba(111, 211, 255, 0.25);
      background: rgba(11, 16, 24, 0.92);
      color: var(--ink);
      cursor: pointer;
    }

    #actions button:hover {
      border-color: rgba(111, 211, 255, 0.55);
      color: var(--accent);
    }

    #hint {
      color: var(--muted);
      font-size: 12px;
      pointer-events: auto;
    }

    #diag {
      margin-top: 10px;
      max-height: 180px;
      overflow: auto;
      color: var(--muted);
      font: 12px/1.35 Consolas, "SFMono-Regular", Menlo, monospace;
      white-space: pre-wrap;
      pointer-events: auto;
    }

    #diag.hidden {
      display: none;
    }

    #overlay.error {
      border-color: rgba(255, 111, 145, 0.45);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-left">
      <div id="title">EmptyEpsilon WebAssembly Build</div>
      <div id="hud-actions">
        <button id="toggle-fullscreen" type="button">Enter Full Screen</button>
        <button id="back-to-ship-selection" type="button">Back To Ship Selection</button>
        <button id="export-asset-trace" type="button" hidden>Export Asset Trace</button>
        <button id="ptt-server" type="button">Talk To Server</button>
        <button id="ptt-ship" type="button">Talk To Ship</button>
        <button id="help-btn" type="button">Help</button>
        <button id="next-station-btn" type="button">Next Station</button>
      </div>
    </div>
    <div id="status">Initializing...</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="toast" aria-live="polite"></div>
    <div id="overlay">
      <strong>EmptyEpsilon</strong>
      <div id="controls">
        <label>
          Your Name
          <input id="player-name" type="text" value="web_user" spellcheck="false" autocomplete="nickname">
        </label>
        <label>
          Mission
          <div id="session-list">
            <div class="session-loading">Loading available missions…</div>
          </div>
        </label>
        <label>
          Station
          <div id="station-grid">
            <button class="station-btn selected" type="button" data-station="relay">Relay</button>
            <button class="station-btn" type="button" data-station="helms">Helms</button>
            <button class="station-btn" type="button" data-station="weapons">Weapons</button>
            <button class="station-btn" type="button" data-station="science">Science</button>
            <button class="station-btn" type="button" data-station="engineering">Engineering</button>
            <button class="station-btn" type="button" data-station="operations">Operations</button>
            <button class="station-btn" type="button" data-station="tactical">Tactical</button>
            <button class="station-btn" type="button" data-station="singlepilot">Single Pilot</button>
            <button class="station-btn" type="button" data-station="mainscreen">Main Screen</button>
          </div>
        </label>
        <button id="join-btn" type="button" disabled>Join Mission</button>
        <div id="audio-state" style="color: var(--muted); font-size: 12px;">Audio: waiting for runtime</div>
        <button id="advanced-toggle" type="button">Advanced options</button>
        <div id="advanced-panel">
          <div id="actions">
            <button id="launch-spectator" type="button">Local Spectator</button>
            <button id="launch-menu" type="button">Main Menu</button>
            <button id="test-audio" type="button">Test Audio</button>
          </div>
          <label>
            Bridge URL (override)
            <input id="bridge-url" type="text" value="" spellcheck="false" placeholder="wss://…">
          </label>
          <label>
            Station (override)
            <select id="station-select">
              <option value="relay" selected>Relay</option>
              <option value="science">Science</option>
              <option value="helms">Helms</option>
              <option value="weapons">Weapons</option>
              <option value="engineering">Engineering</option>
              <option value="operations">Operations</option>
              <option value="tactical">Tactical</option>
              <option value="singlepilot">Single Pilot</option>
              <option value="mainscreen">Main Screen</option>
            </select>
          </label>
          <div id="actions">
            <button id="launch-bridge" type="button">Bridge Connect</button>
          </div>
          <div id="hint">URL params: <code>?bridge=</code>, <code>?station=</code>, <code>?username=</code>, <code>?mode=menu</code>.</div>
        </div>
      </div>
      <div id="diag">browser shell ready</div>
    </div>
  </div>
  <script>
    const statusNode = document.getElementById("status");
    const overlayNode = document.getElementById("overlay");
    const diagNode = document.getElementById("diag");
    const canvas = document.getElementById("canvas");
    const bridgeInput = document.getElementById("bridge-url");
    const playerNameInput = document.getElementById("player-name");
    const stationSelect = document.getElementById("station-select");
    const audioStateNode = document.getElementById("audio-state");
    const joinBtn = document.getElementById("join-btn");
    const sessionListNode = document.getElementById("session-list");
    const stationGrid = document.getElementById("station-grid");
    const advancedToggle = document.getElementById("advanced-toggle");
    const advancedPanel = document.getElementById("advanced-panel");
    const fullscreenButton = document.getElementById("toggle-fullscreen");
    const backToShipSelectionButton = document.getElementById("back-to-ship-selection");
    const exportAssetTraceButton = document.getElementById("export-asset-trace");
    const pttServerButton = document.getElementById("ptt-server");
    const pttShipButton = document.getElementById("ptt-ship");
    const helpButton = document.getElementById("help-btn");
    const nextStationButton = document.getElementById("next-station-btn");
    const toastNode = document.getElementById("toast");
    let runtimeReady = false;
    let microphoneState = "unknown";
    let microphoneUnavailableReason = "";
    let toastHideTimer = 0;
    const params = new URLSearchParams(window.location.search);
    const moduleArgs = [];
    const diagEnabled = params.get("diag") === "1";
    const diagLines = [];
    const maxDiagLines = 120;
    const defaultBridgeHost = window.location.hostname || "127.0.0.1";
    const defaultBridgeScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const defaultBridgeUrl = defaultBridgeScheme + "://" + defaultBridgeHost + ":35667";
    const defaultSessionManifestUrl = params.get("sessionManifest") || "/admin-api/browser/session-manifest.json";
    const loadedBrowserBundles = new Map();
    const browserScenarioRequestState = Object.create(null);
    window.EmptyEpsilonBrowserScenarioRequestState = browserScenarioRequestState;
    const assetTraceEnabled = params.get("assetTrace") === "1";
    const assetTrace = {
      enabled: assetTraceEnabled,
      installed: false,
      scenario: "",
      paths: new Set(),
      bundleIds: new Set(),
      reset() {
        this.paths.clear();
        this.bundleIds.clear();
      },
      setScenario(value) {
        this.scenario = String(value || "");
      },
      recordPath(value) {
        if (!this.enabled || !value) {
          return;
        }
        const normalized = String(value).replace(/\\/g, "/");
        if (!normalized.startsWith("/resources/") && !normalized.startsWith("/packs/") && !normalized.startsWith("/scripts/")) {
          return;
        }
        this.paths.add(normalized);
      },
      recordBundle(bundleId) {
        if (this.enabled && bundleId) {
          this.bundleIds.add(String(bundleId));
        }
      },
      install() {
        // Temporary browser-side instrumentation for tightening scenario bundle manifests.
        // Remove this block once the trace-driven split is no longer needed.
        if (!this.enabled || this.installed || typeof FS === "undefined" || typeof FS.open !== "function") {
          return;
        }
        const originalOpen = FS.open.bind(FS);
        const trace = this;
        FS.open = function(path, flags, mode) {
          let permissions = "";
          try {
            permissions = typeof FS.flagsToPermissionString === "function" ? FS.flagsToPermissionString(flags) : String(flags || "");
          } catch (_error) {
            permissions = String(flags || "");
          }
          if (permissions.indexOf("r") !== -1 && typeof path === "string") {
            trace.recordPath(path);
          }
          return originalOpen(path, flags, mode);
        };
        this.installed = true;
      },
      export() {
        const payload = {
          scenario: this.scenario,
          loaded_bundles: Array.from(this.bundleIds).sort(),
          opened_paths: Array.from(this.paths).sort()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const slug = (this.scenario || "asset-trace").replace(/[^a-z0-9._-]+/gi, "-");
        link.href = url;
        link.download = slug + ".asset-trace.json";
        link.click();
        URL.revokeObjectURL(url);
        return payload;
      }
    };
    window.EmptyEpsilonAssetTrace = assetTrace;

    function resolveAssetUrl(value) {
      return new URL(String(value || ""), window.location.href).toString();
    }

    function setOverlayVisible(visible) {
      if (diagEnabled || visible) {
        overlayNode.style.display = "block";
      } else {
        overlayNode.style.display = "none";
      }
    }

    function ensureFsDirectory(absolutePath) {
      const segments = absolutePath.split("/").filter(Boolean);
      let current = "";
      for (const segment of segments) {
        current += "/" + segment;
        try {
          FS.mkdir(current);
        } catch (error) {
          if (!/File exists/.test(String(error))) {
            throw error;
          }
        }
      }
    }

    function parseBinaryBundle(buffer) {
      const bytes = new Uint8Array(buffer);
      const magicBytes = [69, 69, 66, 78, 68, 76, 49, 0];
      for (let index = 0; index < magicBytes.length; index += 1) {
        if (bytes[index] !== magicBytes[index]) {
          throw new Error("Unknown binary bundle header");
        }
      }
      const view = new DataView(buffer);
      const version = view.getUint32(8, true);
      if (version !== 1) {
        throw new Error("Unsupported binary bundle version " + version);
      }
      const fileCount = view.getUint32(12, true);
      const decoder = new TextDecoder("utf-8");
      const files = [];
      let offset = 16;
      for (let fileIndex = 0; fileIndex < fileCount; fileIndex += 1) {
        const pathLength = view.getUint32(offset, true);
        offset += 4;
        const dataLength = view.getUint32(offset, true);
        offset += 4;
        const pathBytes = bytes.slice(offset, offset + pathLength);
        offset += pathLength;
        const fileBytes = bytes.slice(offset, offset + dataLength);
        offset += dataLength;
        files.push({
          path: decoder.decode(pathBytes),
          data: fileBytes
        });
      }
      return files;
    }

    const assetLoader = {
      scenarioIndexPromise: null,
      currentLoadPromise: Promise.resolve(),
      ensureScenarioRequestState(scenarioFilename) {
        const key = String(scenarioFilename || "");
        if (!browserScenarioRequestState[key]) {
          browserScenarioRequestState[key] = {
            ready: false,
            failed: false,
            error: "",
            status: ""
          };
        }
        return browserScenarioRequestState[key];
      },
      reportScenarioStatus(scenarioFilename, message) {
        const text = String(message || "");
        const state = this.ensureScenarioRequestState(scenarioFilename);
        state.status = text;
        if (diagEnabled) {
          window.EmptyEpsilonDiag("local assets [" + scenarioFilename + "]: " + text);
        }
      },
      async fetchJsonWithFallback(urls) {
        const attempts = [];
        for (const candidate of urls) {
          if (!candidate) {
            continue;
          }
          const resolvedUrl = resolveAssetUrl(candidate);
          try {
            const response = await window.fetch(resolvedUrl, { cache: "default" });
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return await response.json();
          } catch (error) {
            attempts.push(resolvedUrl + " (" + error + ")");
          }
        }
        throw new Error(attempts.join("; "));
      },
      async fetchArrayBufferWithFallback(urls) {
        const attempts = [];
        for (const candidate of urls) {
          if (!candidate) {
            continue;
          }
          const resolvedUrl = resolveAssetUrl(candidate);
          try {
            const response = await window.fetch(resolvedUrl, { cache: "default" });
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return await response.arrayBuffer();
          } catch (error) {
            attempts.push(resolvedUrl + " (" + error + ")");
          }
        }
        throw new Error(attempts.join("; "));
      },
      async getScenarioIndex() {
        if (!this.scenarioIndexPromise) {
          this.scenarioIndexPromise = this.fetchJsonWithFallback(["/asset_bundles/index.json"]);
        }
        return this.scenarioIndexPromise;
      },
      async mountBundle(bundleManifest, scenarioFilename) {
        if (!bundleManifest || !bundleManifest.bundle_id) {
          throw new Error("Bundle manifest missing bundle_id");
        }
        if (loadedBrowserBundles.get(bundleManifest.bundle_id) === bundleManifest.content_hash) {
          if (scenarioFilename) {
            this.reportScenarioStatus(scenarioFilename, "Reusing bundle " + bundleManifest.bundle_id);
          }
          assetTrace.recordBundle(bundleManifest.bundle_id);
          return;
        }
        if (scenarioFilename) {
          this.reportScenarioStatus(scenarioFilename, "Downloading bundle " + bundleManifest.bundle_id);
        }
        setStatus("Downloading asset bundle " + bundleManifest.bundle_id, false);
        const bundleBuffer = await this.fetchArrayBufferWithFallback([
          bundleManifest.artifact_url,
          bundleManifest.fallback_url
        ]);
        if (scenarioFilename) {
          this.reportScenarioStatus(scenarioFilename, "Mounting bundle " + bundleManifest.bundle_id);
        }
        const bundleFiles = parseBinaryBundle(bundleBuffer);
        for (const fileEntry of bundleFiles) {
          const absolutePath = "/" + String(fileEntry.path || "").replace(/^\/+/, "");
          const slashIndex = absolutePath.lastIndexOf("/");
          if (slashIndex > 0) {
            ensureFsDirectory(absolutePath.slice(0, slashIndex));
          }
          FS.writeFile(absolutePath, fileEntry.data);
        }
        loadedBrowserBundles.set(bundleManifest.bundle_id, bundleManifest.content_hash || "loaded");
        assetTrace.recordBundle(bundleManifest.bundle_id);
      },
      async loadScenarioManifestObject(manifest, reasonLabel, scenarioFilename) {
        if (!manifest || !Array.isArray(manifest.required_bundles)) {
          throw new Error("Scenario manifest missing required_bundles");
        }
        assetTrace.setScenario(manifest.scenario_file || reasonLabel || "");
        setStatus("Preparing " + (reasonLabel || manifest.scenario_file || "scenario"), false);
        if (scenarioFilename) {
          this.reportScenarioStatus(scenarioFilename, "Manifest resolved");
        }
        for (const bundleManifest of manifest.required_bundles) {
          await this.mountBundle(bundleManifest, scenarioFilename);
        }
        if (scenarioFilename) {
          this.reportScenarioStatus(scenarioFilename, "Scenario assets ready");
        }
        return manifest;
      },
      async loadScenarioManifestUrl(url, reasonLabel, scenarioFilename) {
        const manifest = await this.fetchJsonWithFallback([url]);
        return this.loadScenarioManifestObject(manifest, reasonLabel, scenarioFilename);
      },
      async preloadLaunchAssets() {
        if (!params.has("bridge")) {
          return;
        }
        setOverlayVisible(true);
        const sessionManifest = await this.fetchJsonWithFallback([defaultSessionManifestUrl]);
        if (!sessionManifest || !sessionManifest.scenario_manifest) {
          throw new Error("Remote session manifest missing scenario_manifest");
        }
        await this.loadScenarioManifestObject(sessionManifest.scenario_manifest, sessionManifest.scenario_file || "remote scenario");
      },
      requestScenarioAssets(scenarioFilename, localSession) {
        const state = this.ensureScenarioRequestState(scenarioFilename);
        state.ready = false;
        state.failed = false;
        state.error = "";
        state.status = "Queued";
        let completionSent = false;
        const complete = (kind, detail) => {
          if (completionSent) {
            return;
          }
          completionSent = true;
          if (kind === "ready") {
            state.ready = true;
            state.failed = false;
            state.error = "";
            this.reportScenarioStatus(scenarioFilename, "Ready");
            return;
          }
          state.ready = false;
          state.failed = true;
          state.error = String(detail || "Browser asset request failed");
          this.reportScenarioStatus(scenarioFilename, "Failed: " + String(detail || "Browser asset request failed"));
        };
        const finishReady = () => {
          complete("ready");
        };
        const finishFailed = (error) => {
          complete("failed", error);
        };
        this.currentLoadPromise = this.currentLoadPromise.then(async () => {
          if (!localSession) {
            setOverlayVisible(true);
          }
          this.reportScenarioStatus(scenarioFilename, "Resolving manifest");
          const scenarioIndex = await this.getScenarioIndex();
          const scenarioEntry = scenarioIndex && scenarioIndex.scenarios ? scenarioIndex.scenarios[scenarioFilename] : null;
          if (!scenarioEntry || !scenarioEntry.scenario_manifest_url) {
            throw new Error("No browser asset manifest configured for " + scenarioFilename);
          }
          await this.loadScenarioManifestUrl(
            scenarioEntry.scenario_manifest_url,
            (localSession ? "local " : "") + scenarioFilename,
            scenarioFilename
          );
          if (!localSession && !diagEnabled) {
            setOverlayVisible(false);
          }
          setStatus("Scenario assets ready for " + scenarioFilename, false);
          finishReady();
        }).catch((error) => {
          setStatus("Asset download failed for " + scenarioFilename, true);
          if (!localSession) {
            setOverlayVisible(true);
          }
          finishFailed(error);
        });
        return this.currentLoadPromise;
      },
      async handleRemoteSessionManifestChanged(manifestUrl, revision) {
        setOverlayVisible(true);
        setStatus("Updating scenario assets", false);
        const sessionManifest = await this.fetchJsonWithFallback([manifestUrl || defaultSessionManifestUrl]);
        if (!sessionManifest || !sessionManifest.scenario_manifest) {
          throw new Error("Changed session manifest missing scenario_manifest");
        }
        await this.loadScenarioManifestObject(sessionManifest.scenario_manifest, sessionManifest.scenario_file || "updated scenario");
        if (!diagEnabled) {
          setOverlayVisible(false);
        }
        setStatus("Scenario assets updated" + (revision ? " (" + revision + ")" : ""), false);
      }
    };
    window.EmptyEpsilonAssetLoader = assetLoader;
    window.EmptyEpsilonOnRemoteSessionManifestChanged = function(manifestUrl, revision) {
      assetLoader.handleRemoteSessionManifestChanged(manifestUrl, revision).catch(function(error) {
        setOverlayVisible(true);
        setStatus("Scenario asset update failed: " + error, true);
      });
    };

      if (!session.status_url) return;
      try {
        const response = await window.fetch(resolveAssetUrl(session.status_url), { cache: "no-store" });
        if (!response.ok) return;
        const text = await response.text();
        // Response is JSONP: window.EmptyEpsilonAdminStatus && window.EmptyEpsilonAdminStatus({...});
        const match = text.match(/EmptyEpsilonAdminStatus\s*\(\s*(\{[\s\S]*\})\s*\)/);
        if (!match) return;
        const data = JSON.parse(match[1]);
        const count = data && typeof data.player_count === "number" ? data.player_count : null;
        if (!lobbyState.statusPolls[session.id]) lobbyState.statusPolls[session.id] = {};
        lobbyState.statusPolls[session.id].count = count;
        lobbyUpdateCount(session.id, count);
      } catch (_e) {
        // status poll failures are silent
      }
    }

    function measureCanvasTargetSize() {
      const width = Math.max(1, Math.round(canvas.clientWidth || canvas.parentElement?.clientWidth || window.innerWidth || 1));
      const height = Math.max(1, Math.round(canvas.clientHeight || canvas.parentElement?.clientHeight || (window.innerHeight - document.getElementById("hud").offsetHeight) || 1));
      return { width, height };

    function syncCanvasElementSizeImmediately() {
      const size = measureCanvasTargetSize();

    function bindPushToTalkButton(button, targetIdentifier, label) {
      let active = false;
      const activate = async function(event) {
        event.preventDefault();
        if (active) {
          return;
        }
        if (microphoneState === "denied") {
          setStatus("Microphone blocked in browser/site settings", true);
          showToast("Microphone is blocked for this site. Re-enable it in browser settings.");
          return;
        }
        if (microphoneState !== "granted") {
          const granted = await requestBrowserMicrophone();
          if (!granted) {
            if (microphoneState === "denied") {
              setStatus("Microphone blocked in browser/site settings", true);
              showToast("Microphone is blocked for this site. Re-enable it in browser settings.");
            } else if (microphoneState === "unavailable") {
              if (microphoneUnavailableReason === "secure-context") {
                setStatus("Microphone access requires HTTPS or localhost", true);
                showToast("Microphone access requires HTTPS or localhost on iPad Safari.");
              } else {
                setStatus("Microphone capture unavailable in this browser", true);
                showToast("This browser does not have microphone capture available.");
              }
            } else {
              setStatus("Microphone access needed for push-to-talk", true);
              showToast("Enable the microphone for this site, then try push-to-talk again.");
            }
            return;
          }
        }
        if (microphoneState !== "granted") {
          setStatus("Microphone access needed for push-to-talk", true);
          showToast("Enable the microphone for this site, then try push-to-talk again.");
          return;
        }
        tryResumeBrowserAudio();
        ensureEngineAudioStarted();
        active = true;
        setVoiceKey(targetIdentifier, true);
        button.classList.add("active");
        setStatus("Push-to-talk: " + label, false);

      const deactivate = function(event) {
        if (event) {
          event.preventDefault();

          return;

        active = false;
        setVoiceKey(targetIdentifier, false);
        button.classList.remove("active");
        if (runtimeReady) {
          setStatus("Runtime initialized", false);
        }

      if (window.PointerEvent) {
        button.addEventListener("pointerdown", activate);
        button.addEventListener("pointerup", deactivate);
        button.addEventListener("pointercancel", deactivate);
        button.addEventListener("lostpointercapture", deactivate);
        button.addEventListener("pointerleave", deactivate);
      } else {
        button.addEventListener("touchstart", activate, { passive: false });
        button.addEventListener("touchend", deactivate, { passive: false });
        button.addEventListener("touchcancel", deactivate, { passive: false });
        button.addEventListener("mousedown", activate);
        button.addEventListener("mouseup", deactivate);
        button.addEventListener("mouseleave", deactivate);

    function requestBrowserMicrophone() {
      if (microphoneState === "granted") {
        return Promise.resolve(true);

      if (!window.isSecureContext) {
        microphoneUnavailableReason = "secure-context";

      const mediaDevices = navigator.mediaDevices;

        setMicrophoneState("granted");

            setMicrophoneState("denied");

        syncState();

          showToast("Fullscreen is not available here. On iPad Safari, Add to Home Screen may be the closest fallback.");
        } else {
          const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
          setStatus(active ? "Entered fullscreen" : "Exited fullscreen", false);
        }
      }).catch(function(error) {
        updateFullscreenButton();
        setStatus("Fullscreen failed", true);
        showToast("Fullscreen failed: " + error);
      });
    });

    var Module = {
      arguments: moduleArgs,
      canvas,
      preRun: [function() {
        if (typeof FS === "undefined" || typeof IDBFS === "undefined") {
          window.EmptyEpsilonDiag("idbfs: unavailable in runtime");
        } else {
          try {
            FS.mkdir(configMountPoint);
          } catch (error) {
            if (!/File exists/.test(String(error))) {
              throw error;
            }
          }
          FS.mount(IDBFS, {}, configMountPoint);
          addRunDependency("ee-idbfs-load");
          window.EmptyEpsilonDiag("idbfs: syncing from browser storage at " + configMountPoint);
          FS.syncfs(true, function(err) {
            if (err) {
              window.EmptyEpsilonDiag("idbfs: initial sync failed");
            } else {
              window.EmptyEpsilonDiag("idbfs: initial sync complete");
            }
            removeRunDependency("ee-idbfs-load");
          });
        }
        addRunDependency("ee-browser-assets");
        assetLoader.preloadLaunchAssets().then(function() {
          removeRunDependency("ee-browser-assets");
        }).catch(function(error) {
          window.EmptyEpsilonDiag("asset preload failed: " + error);
          setOverlayVisible(true);
          setStatus("Scenario asset preload failed: " + error, true);
          removeRunDependency("ee-browser-assets");
        });
      }],
      setStatus: function(message) {
        setStatus(message || "Running", false);
      },
      print: function(message) {
        console.log(message);
      },
      printErr: function(message) {
        console.error(message);
      },
      onRuntimeInitialized: function() {
        runtimeReady = true;
        assetTrace.install();
        backToShipSelectionButton.disabled = false;
        setStatus("Runtime initialized", false);
        window.EmptyEpsilonDiag("runtime initialized");
        window.EmptyEpsilonDiag("browser profile: " + activeProfileLabel + " -> " + configMountPoint);
        syncCanvasSize();
        window.setTimeout(syncCanvasSize, 0);
        window.setTimeout(syncCanvasSize, 100);
        updateAudioState();
        focusGameCanvas();
        if (moduleArgs.length) {
          window.EmptyEpsilonDiag("argv: " + moduleArgs.join(" "));
        }
      },
      monitorRunDependencies: function(left) {
        if (left > 0) {
          setStatus("Downloading assets (" + left + " remaining)", false);
        } else {
          setStatus("Starting", false);
        }
      }
    };

    window.addEventListener("error", function(event) {
      window.EmptyEpsilonDiag("startup error: " + event.message);
      setStatus("Startup error: " + event.message, true);
    });
    syncCanvasElementSizeImmediately();
    window.addEventListener("load", syncCanvasElementSizeImmediately);
    for (const eventName of ["pointerdown", "touchstart", "mousedown", "keydown"]) {
      window.addEventListener(eventName, function(event) {
        tryResumeBrowserAudio();
        ensureEngineAudioStarted();
        if (!shellControlHasFocus() && !isShellControlTarget(event.target)) {
          focusGameCanvas();
        }
      }, { passive: true });
    }
    window.addEventListener("pageshow", function() {
      syncCanvasSize();
      updateFullscreenButton();
      if (runtimeReady && !shellControlHasFocus()) {
        focusGameCanvas();
      }
    });
    window.addEventListener("resize", syncCanvasSize);
    document.addEventListener("fullscreenchange", syncCanvasSize);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    if (window.ResizeObserver) {
      const resizeObserver = new ResizeObserver(function() {
        syncCanvasSize();
      });
      resizeObserver.observe(document.getElementById("canvas-wrap"));
    }
    updateFullscreenButton();
    backToShipSelectionButton.disabled = true;
    exportAssetTraceButton.hidden = !assetTraceEnabled;
    exportAssetTraceButton.addEventListener("click", function(event) {
      event.preventDefault();
      const payload = assetTrace.export();
      setStatus("Exported asset trace for " + (payload.scenario || "current session"), false);
    });
    bindPushToTalkButton(pttServerButton, 0, "server");
    bindPushToTalkButton(pttShipButton, 1, "ship");
    helpButton.addEventListener("click", function() {
      forwardHelpKey(true);
      window.setTimeout(function() { forwardHelpKey(false); }, 60);
    });
    nextStationButton.addEventListener("click", function() {
      forwardNextStationKey(true);
      window.setTimeout(function() { forwardNextStationKey(false); }, 60);
    });
    window.addEventListener("pagehide", flushPersistentState);
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "hidden") {
        flushPersistentState();
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
