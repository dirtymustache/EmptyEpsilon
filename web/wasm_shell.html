<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmptyEpsilon Web</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: rgba(11, 16, 24, 0.88);
      --ink: #d8e1ec;
      --muted: #8ea0b5;
      --accent: #6fd3ff;
      --danger: #ff6f91;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(49, 94, 157, 0.35), transparent 35%),
        linear-gradient(180deg, #08111c 0%, var(--bg) 100%);
      color: var(--ink);
      font: 14px/1.4 "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    #title {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #status {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #canvas-wrap {
      position: relative;
      min-height: 0;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #000;
    }

    #overlay {
      position: absolute;
      inset: 18px auto auto 18px;
      max-width: min(460px, calc(100% - 36px));
      padding: 12px 14px;
      background: rgba(7, 10, 16, 0.76);
      border: 1px solid rgba(111, 211, 255, 0.25);
      color: var(--ink);
      backdrop-filter: blur(12px);
    }

    #overlay strong {
      color: var(--accent);
    }

    #controls {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    #controls label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    #controls input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(14, 20, 31, 0.96);
      color: var(--ink);
      outline: none;
    }

    #controls select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(14, 20, 31, 0.96);
      color: var(--ink);
      outline: none;
    }

    #controls input:focus {
      border-color: rgba(111, 211, 255, 0.5);
    }

    #controls select:focus {
      border-color: rgba(111, 211, 255, 0.5);
    }

    #actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #actions button {
      padding: 10px 12px;
      border: 1px solid rgba(111, 211, 255, 0.25);
      background: rgba(11, 16, 24, 0.92);
      color: var(--ink);
      cursor: pointer;
    }

    #actions button:hover {
      border-color: rgba(111, 211, 255, 0.55);
      color: var(--accent);
    }

    #hint {
      color: var(--muted);
      font-size: 12px;
    }

    #diag {
      margin-top: 10px;
      max-height: 180px;
      overflow: auto;
      color: var(--muted);
      font: 12px/1.35 Consolas, "SFMono-Regular", Menlo, monospace;
      white-space: pre-wrap;
    }

    #diag.hidden {
      display: none;
    }

    #overlay.error {
      border-color: rgba(255, 111, 145, 0.45);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">EmptyEpsilon WebAssembly Build</div>
    <div id="status">Initializing...</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="overlay">
      <strong>Browser milestone:</strong> local spectator and bridge-connected multiplayer client slices are both available.
      <div id="controls">
        <label>
          Bridge URL
          <input id="bridge-url" type="text" value="ws://127.0.0.1:35667" spellcheck="false">
        </label>
        <label>
          Player Name
          <input id="player-name" type="text" value="web_user" spellcheck="false">
        </label>
        <label>
          Bridge Station
          <select id="station-select">
            <option value="relay" selected>Relay</option>
            <option value="science">Science</option>
            <option value="helms">Helms</option>
            <option value="weapons">Weapons</option>
            <option value="engineering">Engineering</option>
            <option value="operations">Operations</option>
            <option value="tactical">Tactical</option>
            <option value="singlepilot">Single Pilot</option>
            <option value="mainscreen">Main Screen</option>
          </select>
        </label>
        <div id="actions">
          <button id="launch-spectator" type="button">Local Spectator</button>
          <button id="launch-menu" type="button">Main Menu</button>
          <button id="launch-bridge" type="button">Bridge Connect</button>
        </div>
        <div id="hint">URL params still work: <code>?bridge=ws://127.0.0.1:35667</code>, <code>?station=relay</code>, <code>?mode=menu</code>, <code>?username=web_user</code>.</div>
      </div>
      <div id="diag">browser shell ready</div>
    </div>
  </div>
  <script>
    const statusNode = document.getElementById("status");
    const overlayNode = document.getElementById("overlay");
    const diagNode = document.getElementById("diag");
    const canvas = document.getElementById("canvas");
    const bridgeInput = document.getElementById("bridge-url");
    const playerNameInput = document.getElementById("player-name");
    const stationSelect = document.getElementById("station-select");
    let runtimeReady = false;
    const params = new URLSearchParams(window.location.search);
    const moduleArgs = [];
    const diagEnabled = params.get("diag") === "1";
    const diagLines = [];
    const maxDiagLines = 120;

    function appendArg(key, value) {
      if (!value) {
        return;
      }
      moduleArgs.push(key + "=" + value);
    }

    if (params.has("bridge")) {
      appendArg("browser_bootstrap", "0");
      appendArg("browser_connect", params.get("bridge"));
    }
    if (params.get("mode") === "menu") {
      appendArg("browser_bootstrap", "0");
    }
    if (params.has("scenario")) {
      appendArg("browser_scenario", params.get("scenario"));
    }
    if (params.has("bootstrap")) {
      appendArg("browser_bootstrap", params.get("bootstrap"));
    }
    if (params.has("username")) {
      appendArg("username", params.get("username"));
    }
    if (params.has("station")) {
      appendArg("browser_station", params.get("station"));
    }

    if (params.has("bridge")) {
      bridgeInput.value = params.get("bridge");
    }
    if (params.has("username")) {
      playerNameInput.value = params.get("username");
    }
    if (params.has("station")) {
      stationSelect.value = params.get("station");
    }

    function launchWithParams(nextParams) {
      const url = new URL(window.location.href);
      url.search = nextParams.toString();
      window.location.href = url.toString();
    }

    document.getElementById("launch-spectator").addEventListener("click", function() {
      const nextParams = new URLSearchParams();
      const username = playerNameInput.value.trim();
      if (username) {
        nextParams.set("username", username);
      }
      launchWithParams(nextParams);
    });

    document.getElementById("launch-menu").addEventListener("click", function() {
      const nextParams = new URLSearchParams();
      nextParams.set("mode", "menu");
      const username = playerNameInput.value.trim();
      if (username) {
        nextParams.set("username", username);
      }
      launchWithParams(nextParams);
    });

    document.getElementById("launch-bridge").addEventListener("click", function() {
      const nextParams = new URLSearchParams();
      nextParams.set("bridge", bridgeInput.value.trim() || "ws://127.0.0.1:35667");
      nextParams.set("station", stationSelect.value);
      const username = playerNameInput.value.trim();
      if (username) {
        nextParams.set("username", username);
      }
      launchWithParams(nextParams);
    });

    function setStatus(message, isError) {
      statusNode.textContent = message;
      overlayNode.className = isError ? "error" : "";
    }

    function shellControlHasFocus() {
      const active = document.activeElement;
      return active instanceof HTMLInputElement ||
        active instanceof HTMLSelectElement ||
        active instanceof HTMLTextAreaElement;
    }

    for (const control of [bridgeInput, playerNameInput, stationSelect]) {
      control.addEventListener("focus", function() {
        setStatus("Editing browser launch settings", false);
      });
      control.addEventListener("blur", function() {
        if (!shellControlHasFocus() && runtimeReady) {
          setStatus("Runtime initialized", false);
        }
      });
    }

    for (const type of ["keydown", "keypress", "keyup"]) {
      document.addEventListener(type, function(event) {
        const target = event.target;
        if (
          target instanceof HTMLInputElement ||
          target instanceof HTMLSelectElement ||
          target instanceof HTMLTextAreaElement
        ) {
          event.stopImmediatePropagation();
        }
      }, true);
    }

    function renderDiag() {
      if (!diagEnabled) {
        return;
      }
      diagNode.textContent = diagLines.join("\n");
      diagNode.scrollTop = diagNode.scrollHeight;
    }

    function pushDiagLine(line) {
      if (!diagEnabled) {
        return;
      }
      diagLines.push(line);
      while (diagLines.length > maxDiagLines) {
        diagLines.shift();
      }
      renderDiag();
    }

    function flushPersistentState() {
      if (!runtimeReady || !window.Module || typeof Module._ee_browser_save_configuration !== "function") {
        return;
      }
      try {
        Module._ee_browser_save_configuration();
      } catch (error) {
        window.EmptyEpsilonDiag("idbfs: pagehide save skipped");
      }
    }

    window.EmptyEpsilonDiag = function(message) {
      const line = String(message || "");
      if (!diagEnabled) {
        if (line.startsWith("startup error:")) {
          console.error("[EE wasm] " + line);
        }
        return;
      }
      if (line.startsWith("ws:")) {
        console.debug("[EE wasm] " + line);
        return;
      }
      pushDiagLine(line);
      console.log("[EE wasm] " + line);
    };

    if (!diagEnabled) {
      diagNode.classList.add("hidden");
    } else {
      pushDiagLine("browser shell ready");
    }

    var Module = {
      arguments: moduleArgs,
      canvas,
      preRun: [function() {
        if (typeof FS === "undefined" || typeof IDBFS === "undefined") {
          window.EmptyEpsilonDiag("idbfs: unavailable in runtime");
          return;
        }
        try {
          FS.mkdir("/config");
        } catch (error) {
          if (!/File exists/.test(String(error))) {
            throw error;
          }
        }
        FS.mount(IDBFS, {}, "/config");
        addRunDependency("ee-idbfs-load");
        window.EmptyEpsilonDiag("idbfs: syncing from browser storage");
        FS.syncfs(true, function(err) {
          if (err) {
            window.EmptyEpsilonDiag("idbfs: initial sync failed");
          } else {
            window.EmptyEpsilonDiag("idbfs: initial sync complete");
          }
          removeRunDependency("ee-idbfs-load");
        });
      }],
      setStatus: function(message) {
        setStatus(message || "Running", false);
      },
      print: function(message) {
        console.log(message);
      },
      printErr: function(message) {
        console.error(message);
      },
      onRuntimeInitialized: function() {
        runtimeReady = true;
        setStatus("Runtime initialized", false);
        window.EmptyEpsilonDiag("runtime initialized");
        if (moduleArgs.length) {
          window.EmptyEpsilonDiag("argv: " + moduleArgs.join(" "));
        }
        canvas.focus();
      },
      monitorRunDependencies: function(left) {
        if (left > 0) {
          setStatus("Downloading assets (" + left + " remaining)", false);
        } else {
          setStatus("Starting", false);
        }
      }
    };

    window.addEventListener("error", function(event) {
      window.EmptyEpsilonDiag("startup error: " + event.message);
      setStatus("Startup error: " + event.message, true);
    });
    window.addEventListener("pagehide", flushPersistentState);
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "hidden") {
        flushPersistentState();
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
